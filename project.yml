name: WindsifyFree

options:
  bundleIdPrefix: app.windsify
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES

targets:
  WindsifyFree:
    type: application
    platform: macOS
    sources:
      - FreeApp
      - Sources/Keyboard
      - Sources/Shared/Models.swift
      - Sources/Shared/AppVersionPresentation.swift
      - Sources/Diagnostics/ConflictDiagnostics.swift
      - Sources/App/AccessibilityAuthorization.swift
      - Sources/App/LaunchAtLogin.swift
      - path: Assets
        excludes:
          - "**/* 2.png"
    info:
      path: FreeApp/Info.plist
      properties:
        CFBundleDisplayName: Windsify Free
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.windsify.mac
        PRODUCT_NAME: WindsifyMac
        PRODUCT_MODULE_NAME: WindsifyMac
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

  WindsifyFreeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FreeKeyboardEngineTests.swift
      - Tests/KeyboardRuntimeHelpersTests.swift
      - Tests/ConflictDiagnosticsTests.swift
    dependencies:
      - target: WindsifyFree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.windsify.mac.free-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WindsifyMac.app/Contents/MacOS/WindsifyMac"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  WindsifyFree:
    build:
      targets:
        WindsifyFree: all
        WindsifyFreeTests:
          - test
    test:
      targets:
        - WindsifyFreeTests
